<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1c1914" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b1321f" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-hot" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b1321f" stroke-width="1.1" opacity="0.7"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c1914" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <style>
      .hot { cursor: pointer; }
      .hot.is-on { stroke: #b1321f; }
      rect.hot.is-on, circle.hot.is-on, path.hot.is-on { stroke-width: 3.4; }
      rect.hot.is-on:not([data-hot="p3"]), circle.hot.is-on {
        fill: url(#hatch-hot);
      }
      path.hot.is-on { fill: none; stroke-width: 4.2; stroke-dasharray: 7 4; }
      rect.hot.is-on[data-hot="p3"] {
        fill: none;
        stroke-width: 5;
        stroke-dasharray: 14 8;
      }
      .mark { fill: #eae2d0; stroke: #b1321f; stroke-width: 1.6; }
      .mark.is-on { fill: #b1321f; }
      .mark-n { fill: #b1321f; font-family: "IBM Plex Mono", monospace; font-size: 9px; }
      .mark-n.is-on { fill: #eae2d0; }
      .lbl, .lbl-red { pointer-events: none; font-family: "IBM Plex Mono", monospace; font-size: 9px; }
      .lbl { fill: #1c1914; }
      .lbl-red { fill: #b1321f; }
    </style>
  </defs>
  <rect width="900" height="640" fill="url(#grid)"/>

  <g data-site-plan="residence">
    <rect class="hot" data-hot="p3" x="70" y="50" width="760" height="520" stroke="#1c1914" stroke-width="1.6"/>
    <path d="M 390 570 L 510 570" stroke="#eae2d0" stroke-width="8"/>
    <rect class="hot" data-hot="p1" x="392" y="548" width="116" height="28" stroke="#1c1914" stroke-width="1.4"/>
    <text class="lbl" x="450" y="567" text-anchor="middle">ACCES</text>

    <path class="hot" data-hot="p2" d="M 220 140 H 620 V 300 H 480 V 380 H 220 Z" stroke="#1c1914" stroke-width="1.5" fill="#eae2d0"/>
    <rect x="250" y="170" width="70" height="50" stroke="#1c1914" stroke-width="0.8"/>
    <rect x="340" y="170" width="70" height="50" stroke="#1c1914" stroke-width="0.8"/>
    <rect x="430" y="170" width="70" height="50" stroke="#1c1914" stroke-width="0.8"/>
    <rect x="520" y="170" width="70" height="50" stroke="#1c1914" stroke-width="0.8"/>
    <rect class="hot" data-hot="p5" x="250" y="250" width="200" height="90" fill="url(#hatch-red)" stroke="#b1321f" stroke-width="1.2"/>
    <text class="lbl-red" x="350" y="300" text-anchor="middle">ZONE SENSIBLE</text>
    <text class="lbl" x="420" y="125" text-anchor="middle">LOCAUX / HALL</text>

    <rect class="hot" data-hot="p4" x="70" y="400" width="200" height="170" fill="url(#hatch)" stroke="#1c1914" stroke-width="1"/>
    <text class="lbl" x="170" y="490" text-anchor="middle">PARKING</text>

    <path class="hot" data-hot="p6" d="M 450 400 C 560 400, 700 430, 760 300" stroke="#b1321f" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text class="lbl-red" x="700" y="390">RONDE</text>

    <circle class="mark" data-hot="p1" cx="450" cy="562" r="12"/>
    <text class="mark-n" data-hot="p1" x="450" y="566" text-anchor="middle">1</text>
    <circle class="mark" data-hot="p2" cx="620" cy="220" r="12"/>
    <text class="mark-n" data-hot="p2" x="620" y="224" text-anchor="middle">2</text>
    <circle class="mark" data-hot="p3" cx="450" cy="70" r="12"/>
    <text class="mark-n" data-hot="p3" x="450" y="74" text-anchor="middle">3</text>
    <circle class="mark" data-hot="p4" cx="170" cy="485" r="12"/>
    <text class="mark-n" data-hot="p4" x="170" y="489" text-anchor="middle">4</text>
    <circle class="mark" data-hot="p5" cx="350" cy="295" r="12"/>
    <text class="mark-n" data-hot="p5" x="350" y="299" text-anchor="middle">5</text>
    <circle class="mark" data-hot="p6" cx="720" cy="340" r="12"/>
    <text class="mark-n" data-hot="p6" x="720" y="344" text-anchor="middle">6</text>
  </g>

  <g data-site-plan="chantier" hidden="hidden">
    <rect class="hot" data-hot="p3" x="60" y="40" width="780" height="540" stroke="#1c1914" stroke-width="1.6" stroke-dasharray="10 6"/>
    <rect class="hot" data-hot="p1" x="80" y="520" width="90" height="40" stroke="#1c1914" stroke-width="1.4"/>
    <text class="lbl" x="125" y="544" text-anchor="middle">PORTE A</text>
    <rect class="hot" data-hot="p1" x="730" y="520" width="90" height="40" stroke="#1c1914" stroke-width="1.4"/>
    <text class="lbl" x="775" y="544" text-anchor="middle">PORTE B</text>
    <circle class="hot" data-hot="p2" cx="450" cy="260" r="90" stroke="#1c1914" stroke-width="1.2" fill="url(#hatch)"/>
    <text class="lbl" x="450" y="264" text-anchor="middle">GRUE / STRUCTURE</text>
    <rect class="hot" data-hot="p4" x="80" y="80" width="160" height="120" fill="url(#hatch)" stroke="#1c1914"/>
    <text class="lbl" x="160" y="145" text-anchor="middle">MATERIEL</text>
    <rect class="hot" data-hot="p5" x="680" y="80" width="140" height="80" fill="url(#hatch-red)" stroke="#b1321f"/>
    <text class="lbl-red" x="750" y="125" text-anchor="middle">BASE VIE</text>
    <path class="hot" data-hot="p6" d="M 125 520 L 125 400 L 450 400 L 450 350" stroke="#b1321f" stroke-dasharray="6 5" stroke-width="1.2"/>

    <circle class="mark" data-hot="p1" cx="125" cy="540" r="12"/>
    <text class="mark-n" data-hot="p1" x="125" y="544" text-anchor="middle">1</text>
    <circle class="mark" data-hot="p2" cx="450" cy="260" r="12"/>
    <text class="mark-n" data-hot="p2" x="450" y="264" text-anchor="middle">2</text>
    <circle class="mark" data-hot="p3" cx="450" cy="60" r="12"/>
    <text class="mark-n" data-hot="p3" x="450" y="64" text-anchor="middle">3</text>
    <circle class="mark" data-hot="p4" cx="160" cy="140" r="12"/>
    <text class="mark-n" data-hot="p4" x="160" y="144" text-anchor="middle">4</text>
    <circle class="mark" data-hot="p5" cx="750" cy="120" r="12"/>
    <text class="mark-n" data-hot="p5" x="750" y="124" text-anchor="middle">5</text>
    <circle class="mark" data-hot="p6" cx="450" cy="400" r="12"/>
    <text class="mark-n" data-hot="p6" x="450" y="404" text-anchor="middle">6</text>
  </g>

  <g data-site-plan="commerce" hidden="hidden">
    <rect class="hot" data-hot="p3" x="80" y="70" width="740" height="500" stroke="#1c1914" stroke-width="1.6"/>
    <path d="M 80 570 H 820" stroke="#1c1914" stroke-width="3"/>
    <text class="lbl" x="450" y="600" text-anchor="middle">VOIE PUBLIQUE</text>
    <rect class="hot" data-hot="p1" x="300" y="500" width="140" height="70" stroke="#1c1914" stroke-width="1.4"/>
    <text class="lbl" x="370" y="540" text-anchor="middle">VITRINE / ENTREE</text>
    <rect class="hot" data-hot="p2" x="140" y="140" width="580" height="280" stroke="#1c1914" stroke-width="1.2"/>
    <text class="lbl" x="430" y="280" text-anchor="middle">SURFACE DE VENTE</text>
    <rect class="hot" data-hot="p5" x="140" y="140" width="120" height="90" fill="url(#hatch-red)" stroke="#b1321f"/>
    <text class="lbl-red" x="200" y="190" text-anchor="middle">CAISSE</text>
    <rect class="hot" data-hot="p4" x="620" y="140" width="100" height="160" fill="url(#hatch)" stroke="#1c1914"/>
    <text class="lbl" x="670" y="225" text-anchor="middle">LIVRAISON</text>
    <path class="hot" data-hot="p6" d="M 370 500 V 420 H 670 V 300" stroke="#b1321f" stroke-dasharray="6 5" stroke-width="1.2"/>

    <circle class="mark" data-hot="p1" cx="370" cy="535" r="12"/>
    <text class="mark-n" data-hot="p1" x="370" y="539" text-anchor="middle">1</text>
    <circle class="mark" data-hot="p2" cx="430" cy="280" r="12"/>
    <text class="mark-n" data-hot="p2" x="430" y="284" text-anchor="middle">2</text>
    <circle class="mark" data-hot="p3" cx="80" cy="320" r="12"/>
    <text class="mark-n" data-hot="p3" x="80" y="324" text-anchor="middle">3</text>
    <circle class="mark" data-hot="p4" cx="670" cy="220" r="12"/>
    <text class="mark-n" data-hot="p4" x="670" y="224" text-anchor="middle">4</text>
    <circle class="mark" data-hot="p5" cx="200" cy="185" r="12"/>
    <text class="mark-n" data-hot="p5" x="200" y="189" text-anchor="middle">5</text>
    <circle class="mark" data-hot="p6" cx="670" cy="360" r="12"/>
    <text class="mark-n" data-hot="p6" x="670" y="364" text-anchor="middle">6</text>
  </g>

  <g class="north">
    <path d="M 848 36 L 848 70" stroke="#1c1914" stroke-width="1"/>
    <path d="M 848 36 L 842 48 L 848 44 L 854 48 Z" fill="#1c1914"/>
    <text class="lbl" x="848" y="84" text-anchor="middle">N</text>
  </g>
</svg>
